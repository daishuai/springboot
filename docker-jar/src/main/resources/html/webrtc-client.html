<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Web-RCT Demo</title>
</head>
<body>
<div style="display: flex; height: 100%;">
    <div style="width: 10%;">
        <ul id="peer_list"></ul>
    </div>
    <div style="width: 90%;">
        <div style="text-align: center;">
            <h2>音视频聊天</h2>
            <label for="callerId">我的ID </label><input type="text" id="callerId" />
            <button id="login">登录</button>
            <label for="replyId">呼叫人ID</label><input type="text" id="replyId">
            <button id="call">呼叫</button>
        </div>
        <div style="text-align: center; display: inline-block; width: 100%; margin-top: 50px;">
            <div style="text-align: center; display: inline-block; width: 640px; height: 480px;">
                <video autoplay playsinline id="local_video"></video>
            </div>
            <div style="text-align: center; display: inline-block; width: 640px; height: 480px;">
                <video autoplay playsinline id="remote_video"></video>
            </div>
        </div>
    </div>
</div>
<script src="https://webrtc.github.io/adapter/adapter-latest.js"></script>
<script src="https://cdn.bootcdn.net/ajax/libs/crypto-js/4.0.0/crypto-js.js"></script>
<script type="text/javascript" src="https://apps.bdimg.com/libs/jquery/2.1.4/jquery.min.js"></script>
<script type="text/javascript" src="../sockjs.min.js"></script>
<script type="text/javascript" src="../jsencrypt.min.js"></script>
<script type="text/javascript" src="../js/webrct-client.js"></script>
<script src="https://cdn.bootcdn.net/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
</body>
</html>
